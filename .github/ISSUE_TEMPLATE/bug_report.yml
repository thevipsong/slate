name: Bug 报告
description: 报告可以稳定复现的错误或异常行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交截图前，请先遮盖真实待办内容和其他私人信息。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明发生了什么。
      placeholder: 点击……后，应用……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供尽可能短且稳定的复现流程。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.6
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 序事版本或提交
      placeholder: 例如 1.0.0 或 6fdef7b

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可添加已脱敏的截图、日志或其他上下文。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我已从截图和日志中移除私人待办内容及敏感信息。
          required: true
