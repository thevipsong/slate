name: 功能建议
description: 提议新的功能或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述当前场景中的困难，而不只是给出解决方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想的交互或功能表现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 如需截图，请先移除私人待办内容和敏感信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议。
          required: true
